name: pipeline

# El pipeline corre en cada push a main. La publicacion de la imagen
# solo ocurre en ese caso (ver el job publish).
on:
  push:
    branches:
      - main

# Permisos minimos por defecto; el job de publicacion pide packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar las pruebas
        run: ./mvnw -B test

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generar el JAR
        run: ./mvnw -B package -DskipTests

      - name: Publicar el JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # Publicar unicamente en push a main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar el JAR generado en build
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El paquete hereda la visibilidad del repositorio (publico),
      # por lo que la imagen queda publica en GHCR.
      - name: Calcular el nombre de la imagen en minusculas
        id: imagen
        run: echo "nombre=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Calcular el SHA corto (7 caracteres)
        id: sha
        run: echo "corto=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.imagen.outputs.nombre }}:latest
            ${{ env.REGISTRY }}/${{ steps.imagen.outputs.nombre }}:${{ steps.sha.outputs.corto }}
